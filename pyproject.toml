[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-graphrag"
version = "0.1.0"
description = "GraphRAG for brain-computer-interface research: EEG/BCI abstracts -> knowledge graph -> multi-hop answers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nidhal Kissoum" }]
dependencies = ["networkx>=3.2", "pydantic>=2.5"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
neurograph = "neurograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
